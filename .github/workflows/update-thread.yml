name: Update Thread Formula

on:
  repository_dispatch:
    types: [thread-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Thread release version, without v"
        required: true

permissions:
  contents: write

concurrency:
  group: update-thread-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        env:
          THREAD_RAW_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          THREAD_VERSION="${THREAD_RAW_VERSION#v}"
          if [[ ! "$THREAD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $THREAD_RAW_VERSION" >&2
            exit 1
          fi
          echo "version=$THREAD_VERSION" >> "$GITHUB_OUTPUT"
      - name: Download release checksums and update formula
        env:
          THREAD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          base="https://github.com/convergent-systems-co/thread/releases/download/v${THREAD_VERSION}"
          curl --fail --show-error --silent --location --retry 5 --retry-all-errors \
            "${base}/checksums.txt" -o checksums.txt
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["THREAD_VERSION"]
          expected = {
              "darwin_amd64": f"thread_{version}_darwin_amd64.tar.gz",
              "darwin_arm64": f"thread_{version}_darwin_arm64.tar.gz",
              "linux_amd64": f"thread_{version}_linux_amd64.tar.gz",
              "linux_arm64": f"thread_{version}_linux_arm64.tar.gz",
          }
          published = {}
          for line in pathlib.Path("checksums.txt").read_text().splitlines():
              digest, name = line.split()
              if not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit(f"invalid checksum for {name}")
              published[name] = digest
          missing = sorted(set(expected.values()) - set(published))
          if missing:
              raise SystemExit(f"release checksums missing expected artifacts: {missing}")

          formula = pathlib.Path("Formula/thread.rb")
          source = formula.read_text()
          for platform, artifact in expected.items():
              pattern = rf'(url "https://github\.com/convergent-systems-co/thread/releases/download/)v[^/]+(/thread_)[^_]+(_{platform}\.tar\.gz"\n\s+sha256 ")[0-9a-f]{{64}}(")'
              replacement = rf'\g<1>v{version}\g<2>{version}\g<3>{published[artifact]}\4'
              source, count = re.subn(pattern, replacement, source)
              if count != 1:
                  raise SystemExit(f"expected exactly one URL/checksum pair for {platform}")
          formula.write_text(source)
          PY
          ruby -c Formula/thread.rb
      - name: Commit
        env:
          THREAD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git diff --quiet -- Formula/thread.rb; then
            echo "Thread formula is already at v${THREAD_VERSION}"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add Formula/thread.rb
          git commit -m "chore: update thread to v${THREAD_VERSION}"
          git push
